<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Directivo de Pedidos y Logística</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="glass-card sticky top-0 z-50 border-b border-slate-800 bg-slate-900/90 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-4">
      <div class="p-2.5 bg-blue-600/20 text-blue-400 rounded-xl border border-blue-500/30">
        <i class="fa-solid fa-chart-line text-2xl"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold text-white tracking-wide">PANEL DIRECTIVO DE PEDIDOS</h1>
        <p class="text-xs text-slate-400">Control Operativo, Despachos y Medición OTIF</p>
      </div>
    </div>
  </header>
  <main class="flex-1 p-6 space-y-6 max-w-[1800px] mx-auto w-full">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="glass-card p-5 rounded-2xl border-l-4 border-l-blue-500">
        <p class="text-xs font-semibold uppercase text-slate-400">Total Registros</p>
        <h3 class="text-3xl font-bold text-white mt-2">142</h3>
      </div>
      <div class="glass-card p-5 rounded-2xl border-l-4 border-l-emerald-500">
        <p class="text-xs font-semibold uppercase text-slate-400">Cumplimiento OTIF</p>
        <h3 class="text-3xl font-bold text-emerald-400 mt-2">94.8%</h3>
      </div>
      <div class="glass-card p-5 rounded-2xl border-l-4 border-l-amber-500">
        <p class="text-xs font-semibold uppercase text-slate-400">Lead Time Promedio</p>
        <h3 class="text-3xl font-bold text-amber-400 mt-2">2.4 días</h3>
      </div>
      <div class="glass-card p-5 rounded-2xl border-l-4 border-l-rose-500">
        <p class="text-xs font-semibold uppercase text-slate-400">Novedades / Retrasos</p>
        <h3 class="text-3xl font-bold text-rose-400 mt-2">3</h3>
      </div>
    </div>
  </main>
</body>
</html>
